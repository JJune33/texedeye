<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta http-equiv="Cache-Control" content="no-store">
<title>Texed MediaPipe Eye Test v0.1</title>
<style>
:root{--bg:#101419;--panel:#1c232b;--text:#f4f6f8;--muted:#aab4bf;--accent:#ff8a22;--good:#61dc86;--bad:#ff6269}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
main{max-width:900px;margin:auto;padding:18px}
h1{font-size:24px;margin:0 0 8px;color:var(--accent)}
p{color:var(--muted);line-height:1.45}
button{font-size:18px;font-weight:800;padding:14px 18px;border:0;border-radius:12px;background:var(--accent);color:#111}
button:disabled{opacity:.5}
#status{margin:14px 0;padding:13px;border-radius:12px;background:var(--panel);white-space:pre-wrap}
#stage{position:relative;width:100%;max-width:720px;aspect-ratio:4/3;background:#050709;border-radius:16px;overflow:hidden}
video,canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
canvas{pointer-events:none}
#metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:14px}
.card{background:var(--panel);border-radius:12px;padding:12px}
.label{font-size:13px;color:var(--muted);margin-bottom:5px}
.value{font-size:21px;font-weight:800}
.bar{height:12px;background:#0a0d11;border-radius:99px;overflow:hidden;margin-top:8px}
.fill{height:100%;width:0;background:var(--accent)}
#log{margin-top:14px;background:#07090c;border-radius:12px;padding:12px;min-height:130px;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 monospace;color:#d2dae3}
@media(min-width:700px){#metrics{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<main>
<h1>Texed MediaPipe Eye Test v0.1</h1>
<p>Deze versie gebruikt geen WebGazer. Start de camera en kijk rustig links, rechts, boven en beneden. Knipper daarna een paar keer.</p>
<button id="start">Start MediaPipe</button>
<div id="status">Model nog niet geladen.</div>

<div id="stage">
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>
</div>

<div id="metrics">
  <div class="card">
    <div class="label">Gezicht</div>
    <div id="face" class="value">Nee</div>
  </div>
  <div class="card">
    <div class="label">Geschatte kijkrichting</div>
    <div id="direction" class="value">Midden</div>
  </div>
  <div class="card">
    <div class="label">Knippering links</div>
    <div id="blinkLeft" class="value">0.00</div>
    <div class="bar"><div id="blinkLeftBar" class="fill"></div></div>
  </div>
  <div class="card">
    <div class="label">Knippering rechts</div>
    <div id="blinkRight" class="value">0.00</div>
    <div class="bar"><div id="blinkRightBar" class="fill"></div></div>
  </div>
</div>

<div id="log"></div>
</main>

<script type="module">
import vision from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3";
const {FaceLandmarker,FilesetResolver,DrawingUtils}=vision;

const startButton=document.getElementById("start");
const statusBox=document.getElementById("status");
const video=document.getElementById("video");
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");
const faceEl=document.getElementById("face");
const directionEl=document.getElementById("direction");
const blinkLeftEl=document.getElementById("blinkLeft");
const blinkRightEl=document.getElementById("blinkRight");
const blinkLeftBar=document.getElementById("blinkLeftBar");
const blinkRightBar=document.getElementById("blinkRightBar");
const logBox=document.getElementById("log");

let landmarker=null;
let running=false;
let lastVideoTime=-1;
let lastRun=0;
let drawingUtils=null;

function log(message){
  const time=new Date().toLocaleTimeString();
  logBox.textContent+="["+time+"] "+message+"\n";
}

function setStatus(message,good=false){
  statusBox.textContent=message;
  statusBox.style.color=good?"var(--good)":"var(--text)";
}

function categoryScore(result,name){
  const categories=result.faceBlendshapes?.[0]?.categories||[];
  return categories.find(item=>item.categoryName===name)?.score||0;
}

function average(points){
  const total=points.reduce((sum,p)=>({x:sum.x+p.x,y:sum.y+p.y}),{x:0,y:0});
  return{x:total.x/points.length,y:total.y/points.length};
}

function gazeDirection(lm){
  if(!lm||lm.length<478)return "Onbekend";

  const leftIris=average([lm[468],lm[469],lm[470],lm[471],lm[472]]);
  const rightIris=average([lm[473],lm[474],lm[475],lm[476],lm[477]]);

  const leftOuter=lm[33],leftInner=lm[133];
  const rightInner=lm[362],rightOuter=lm[263];

  const leftX=(leftIris.x-leftOuter.x)/(leftInner.x-leftOuter.x);
  const rightX=(rightIris.x-rightInner.x)/(rightOuter.x-rightInner.x);
  const horizontal=(leftX+rightX)/2;

  const leftTop=lm[159],leftBottom=lm[145];
  const rightTop=lm[386],rightBottom=lm[374];
  const leftY=(leftIris.y-leftTop.y)/(leftBottom.y-leftTop.y);
  const rightY=(rightIris.y-rightTop.y)/(rightBottom.y-rightTop.y);
  const vertical=(leftY+rightY)/2;

  let h="Midden";
  let v="";
  if(horizontal<0.40)h="Rechts";
  else if(horizontal>0.60)h="Links";

  if(vertical<0.38)v="Omhoog";
  else if(vertical>0.62)v="Omlaag";

  return v&&h!=="Midden"?v+" "+h:(v||h);
}

async function createLandmarker(){
  setStatus("MediaPipe bestanden en gezichtsmodel worden geladen...");
  const fileset=await FilesetResolver.forVisionTasks(
    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.3/wasm"
  );

  const options={
    baseOptions:{
      modelAssetPath:"https://storage.googleapis.com/mediapipe-models/face_landmarker/face_landmarker/float16/1/face_landmarker.task",
      delegate:"GPU"
    },
    runningMode:"VIDEO",
    numFaces:1,
    outputFaceBlendshapes:true,
    minFaceDetectionConfidence:0.5,
    minFacePresenceConfidence:0.5,
    minTrackingConfidence:0.5
  };

  try{
    landmarker=await FaceLandmarker.createFromOptions(fileset,options);
    log("Model geladen met GPU");
  }catch(gpuError){
    log("GPU laden mislukt, CPU fallback: "+gpuError.message);
    options.baseOptions.delegate="CPU";
    landmarker=await FaceLandmarker.createFromOptions(fileset,options);
    log("Model geladen met CPU");
  }
  setStatus("Model gereed. Tik op Start MediaPipe.",true);
  startButton.disabled=false;
}

async function startCamera(){
  startButton.disabled=true;
  setStatus("Camera wordt geopend...");
  try{
    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:"user",width:{ideal:640},height:{ideal:480}},
      audio:false
    });
    video.srcObject=stream;
    await video.play();
    canvas.width=video.videoWidth||640;
    canvas.height=video.videoHeight||480;
    drawingUtils=new DrawingUtils(ctx);
    running=true;
    setStatus("MediaPipe actief. Kijk rond en knipper.",true);
    log("Camera gestart: "+canvas.width+"x"+canvas.height);
    requestAnimationFrame(predict);
  }catch(error){
    setStatus(error.name+": "+error.message);
    log(error.stack||String(error));
    startButton.disabled=false;
  }
}

function drawEyes(landmarks){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  drawingUtils.drawConnectors(landmarks,FaceLandmarker.FACE_LANDMARKS_LEFT_EYE,{color:"#61dc86",lineWidth:2});
  drawingUtils.drawConnectors(landmarks,FaceLandmarker.FACE_LANDMARKS_RIGHT_EYE,{color:"#ff6269",lineWidth:2});
  drawingUtils.drawConnectors(landmarks,FaceLandmarker.FACE_LANDMARKS_LEFT_IRIS,{color:"#ffffff",lineWidth:2});
  drawingUtils.drawConnectors(landmarks,FaceLandmarker.FACE_LANDMARKS_RIGHT_IRIS,{color:"#ffffff",lineWidth:2});
}

function predict(now){
  if(!running)return;
  requestAnimationFrame(predict);

  if(video.readyState<2||video.currentTime===lastVideoTime||now-lastRun<70)return;
  lastVideoTime=video.currentTime;
  lastRun=now;

  try{
    const result=landmarker.detectForVideo(video,performance.now());
    const landmarks=result.faceLandmarks?.[0];

    if(!landmarks){
      faceEl.textContent="Nee";
      directionEl.textContent="Geen gezicht";
      ctx.clearRect(0,0,canvas.width,canvas.height);
      return;
    }

    faceEl.textContent="Ja";
    directionEl.textContent=gazeDirection(landmarks);
    drawEyes(landmarks);

    const left=categoryScore(result,"eyeBlinkLeft");
    const right=categoryScore(result,"eyeBlinkRight");
    blinkLeftEl.textContent=left.toFixed(2);
    blinkRightEl.textContent=right.toFixed(2);
    blinkLeftBar.style.width=Math.round(left*100)+"%";
    blinkRightBar.style.width=Math.round(right*100)+"%";
  }catch(error){
    running=false;
    setStatus("Detectiefout: "+error.message);
    log(error.stack||String(error));
  }
}

startButton.disabled=true;
startButton.addEventListener("click",startCamera);

window.addEventListener("error",event=>log("window.error: "+event.message));
window.addEventListener("unhandledrejection",event=>log("unhandledrejection: "+String(event.reason)));

createLandmarker().catch(error=>{
  setStatus("Model laden mislukt: "+error.message);
  log(error.stack||String(error));
});
</script>
</body>
</html>
